[project]
name = "vlmlab"
version = "0.1.0"
description = "Amazon Bedrock の VLM を外観検査に使うときの精度・費用・信頼性を、公開データで測る検証基盤"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40",
    "pandas>=2.2",
    "pillow>=10.4",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[project.scripts]
vlmlab = "vlmlab.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlmlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
