# 12/19 の記事：ARMBench の欠陥検知を Claude Haiku 4.5 で判定する（見本なし、1回、長辺768px）。plan.md の手順4
name: ab1_haiku45
split: data/splits/armbench_eval_200.csv   # ミラーの parquet 4つから1ピック1枚（vlmlab armbench splits。画像は --visa-root data/armbench/mirror/images）
model_id: jp.anthropic.claude-haiku-4-5-20251001-v1:0
region: ap-northeast-1
service_tier: standard
prompt: prompts/armbench_v2_judge.txt   # v1 に「説明や理由は書かないでください。」を足した（試運転で Nova が説明を続けて解析に失敗したため。12/13 と同じ直し方、2026-11-21 決定）
image_long_edge: 768
inference: {temperature: 0, maxTokens: 300}
repeats: 1
budget_usd: 0.6                     # 見積り 0.25 USD（results/estimate.md）
parse:
  allow_code_fence: true
  allow_trailing_code_fence: true   # 11/26 の n3_claude_refB と同じ読み取り規則（CI-P7）
