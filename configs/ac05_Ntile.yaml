# 12/5 の記事：Nova 2 Lite、見本1枚（原寸）＋検査対象を2×2に分けた4枚（原寸から切り出し）。plan.md の手順3
# 埋め込みの画像は1回5枚まで（https://docs.aws.amazon.com/nova/latest/nova2-userguide/using-multimodal-models.html、2026-11-16 確認）
name: ac05_Ntile
split: data/splits/visa_test_200.csv
refs: data/splits/visa_refs.csv
n_refs: 1
model_id: jp.amazon.nova-2-lite-v1:0
region: ap-northeast-1
service_tier: standard
prompt: prompts/v1_judge_tile.txt
image_long_edge: null               # 見本は原寸、タイルは原寸から切り出したまま（Nova 2 Lite は画像1枚230トークンで課金）
tile_grid: 2
inference: {temperature: 0, maxTokens: 300}
repeats: 1
budget_usd: 0.3
parse:
  allow_code_fence: true            # n1_B（N-full）と同じ読み取り規則
