# 単価表（USD / 100万トークン）。実行の直前に料金ページで確かめ、出典と確認日を書く。
# 確かめられなかった単価は null のままにする。入力か出力の単価が null のモデルは `vlmlab run` が実行を断る。
# 料金ページ: https://aws.amazon.com/bedrock/pricing/
#
# 2026-11-05 の確認
#   - 単価は AWS Price List API（aws-pricing MCP、service_code=AmazonBedrock）から取った。
#     価格表の publicationDate 2026-11-02T16:50:15Z、effectiveDate 2026-10-01。API は 1K トークンあたりで返すので、1,000 倍して書いた
#   - Geo のプロファイル（jp. / apac.）は、呼び出し元のリージョン（ap-northeast-1）の単価で課金される
#     （https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html 「The price is calculated based on the Region from which you call an inference profile」）
#   - 料金ページの Nova の表は JavaScript で読み込まれるため、自動では読み出せず、料金ページとの照合はまだ（ブラウザで目視確認が要る）
#   - 詳細は記事フォルダの results/pricing_used.md

models:
  - model_id: jp.amazon.nova-2-lite-v1:0       # JP Geo（ap-northeast-1 / ap-northeast-3 で処理）。東京の単価
    service_tier: standard
    input_per_mtok: 0.396                      # APN1-Nova2.0Lite-input-tokens
    output_per_mtok: 3.311                     # APN1-Nova2.0Lite-output-tokens
    cache_read_per_mtok: 0.099                 # APN1-Nova2.0Lite-cache-read-input-token-count
    cache_write_per_mtok: 0.0                  # APN1-Nova2.0Lite-cache-write-input-token-count
    source_url: "AWS Price List API (AmazonBedrock, ap-northeast-1, publicationDate 2026-11-02)"
    checked_on: "2026-11-05"
    model_id_source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-2-lite.html
    model_id_checked_on: "2026-11-05"
    note: 画像は解像度によらず1枚230トークンで課金（https://docs.aws.amazon.com/nova/latest/nova2-userguide/using-multimodal-models.html、2026-11-05 確認）。料金ページとの照合は未

  - model_id: global.amazon.nova-2-lite-v1:0   # Global（東京から呼んだときの単価）
    service_tier: standard
    input_per_mtok: 0.36                       # APN1-Nova2.0Lite-input-tokens-cross-region-global
    output_per_mtok: 3.01                      # APN1-Nova2.0Lite-output-tokens-cross-region-global
    cache_read_per_mtok: 0.09                  # APN1-Nova2.0Lite-cache-read-input-token-count-cross-region-global
    cache_write_per_mtok: 0.0                  # APN1-Nova2.0Lite-cache-write-input-token-count-cross-region-global
    source_url: "AWS Price List API (AmazonBedrock, ap-northeast-1, publicationDate 2026-11-02)"
    checked_on: "2026-11-05"
    model_id_source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-2-lite.html
    model_id_checked_on: "2026-11-05"
    note: 料金ページとの照合は未

  - model_id: apac.amazon.nova-pro-v1:0        # APAC Geo。jp. のプロファイルは無い（global も非対応）。東京の単価
    service_tier: standard
    input_per_mtok: 0.96                       # APN1-NovaPro-input-tokens
    output_per_mtok: 3.84                      # APN1-NovaPro-output-tokens
    cache_read_per_mtok: 0.24                  # APN1-NovaPro-cache-read-input-token-count
    cache_write_per_mtok: null                 # 東京の standard の SKU が API に無かった（flex・priority は 0.00）
    source_url: "AWS Price List API (AmazonBedrock, ap-northeast-1, publicationDate 2026-11-02)"
    checked_on: "2026-11-05"
    model_id_source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-pro.html
    model_id_checked_on: "2026-11-05"
    note: 画像のトークン数は解像度で変わる（例 900x900 で約1,300。https://docs.aws.amazon.com/nova/latest/userguide/modalities-image.html）。試運転の usage で確かめる。料金ページとの照合は未

# 埋め込み（条件 E。検証セッション2で使う）
embeddings:
  - model_id: amazon.nova-2-multimodal-embeddings-v1:0
    region: us-east-1                          # モデルカードの表は us-east-1（と us-gov-west-1）のみ。Geo / Global は非対応
    per_image_usd: 0.00006                     # 標準の画像（detailLevel=STANDARD_IMAGE）1枚、オンデマンド。batch は 0.00003
    per_document_image_usd: 0.0006             # DOCUMENT_IMAGE（この検証では使わない）
    per_mtok_text_usd: 0.135                   # テキスト。Price List API の USE1-NovaMultiModalEmbeddings-input-tokens と一致
    source_url: "https://aws.amazon.com/bedrock/pricing/ （Amazon Nova > Pricing for Embedding models、US East (N. Virginia)。書き手がブラウザで確認）"
    checked_on: "2026-11-05"
    note: Price List API には画像の SKU が無い。応答ヘッダーの入力トークン数は画像では 0 になる（2026-11-05 の試運転）
    model_id_source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-amazon-nova-multimodal-embeddings.html
    model_id_checked_on: "2026-11-05"
